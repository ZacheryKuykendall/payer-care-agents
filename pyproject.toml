[project]
name = "payer-agents"
version = "0.1.0"
description = "Reference architecture for a governed multi-agent healthcare payer assistant on Azure AI Foundry."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Zachery Kuykendall" }]
keywords = ["azure", "ai-foundry", "multi-agent", "healthcare", "fhir", "mcp", "rag"]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "rich>=13.7",
]

[project.optional-dependencies]
# Everything needed to talk to real Azure services. Mock mode needs none of it.
azure = [
    "azure-identity>=1.17",
    "azure-search-documents>=11.5",
    "azure-core>=1.30",
]
# Microsoft Agent Framework. Prerelease packages; see docs/PREVIEW-STATUS.md.
agentframework = [
    "agent-framework-core>=1.0.0b1",
    "agent-framework-foundry>=1.0.0b1",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
payer-agents = "payer_agents.cli:main"

[project.urls]
Homepage = "https://github.com/zacherykuykendall/payer-agents"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/payer_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:payer_agents.*"]

[tool.coverage.run]
source = ["payer_agents"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
